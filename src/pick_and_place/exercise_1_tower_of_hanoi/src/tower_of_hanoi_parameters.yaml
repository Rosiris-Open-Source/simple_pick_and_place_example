tower_of_hanoi:
  srv_call_timeout: {
    type: int,
    description: "Specifies the timeout for service calls in milliseconds.",
    default_value: 5000,
    validation: {
      gt_eq<>: 0,
      not_empty<>: null,
    },
    read_only: true
  }
  gripper_names: {
    type: string_array,
    default_value: [],
    description: "(optional) Specifies the joints for writing into another controllers reference. This parameter is only relevant when chaining the output of this controller to the input of another controller.",
    validation: {
      unique<>: null,
      not_empty<>: null,
    },
    read_only: true
  }
  grippers:
    __map_gripper_names:
      eef_link: {
        type: string,
        default_value: "",
        description: "Name of the end-effector link for this gripper.",
        read_only: true,
        validation: {
          not_empty<>: null,
        }
      }
      allowed_touch_links: {
        type: string_array,
        default_value: [],
        description: "List of link names that are allowed to be in contact with the object being manipulated without causing a collision.",
        validation: {
          unique<>: null,
        }
      }